management:
  tracing:
    sampling:
      probability: 1.0   # 1.0 = trace 100% of requests. Use lower in prod (e.g. 0.1)
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  application:
    name: mini-project
  data:
    mongodb:
      uri: mongodb://localhost:27017/mini-project

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/Mini-Project

hf:
  api-key: ${HF_API_KEY}
  chat-url: https://api.groq.com/openai/v1
  chat-model: openai/gpt-oss-20b

stt:
  python-path: /home/devxraj/stt-server/.venv/bin/python
  script-path: /home/devxraj/stt-server/stt_cli.py
  timeout-seconds: 120

emotion:
  python-path: /home/devxraj/stt-server/.venv/bin/python
  script-path: /home/devxraj/stt-server/emotion_cli.py


